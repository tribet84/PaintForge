<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PintaMinis — miniature paint inventory">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PintaMinis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <!-- SVG first for modern browsers; the PNG stays as the fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PintaMinis</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Self-heal stale installs.
    //
    // Flutter's service worker is deprecated, and devices that installed an
    // older one keep serving its cached bundle - clearing browsing data does
    // not reliably unregister it, so the app can look frozen on an old
    // version forever. This runs before the bundle loads, tears down any
    // registration plus its caches, and reloads ONCE so the fresh assets are
    // fetched from the network.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var RELOAD_GUARD = 'pintaminis-sw-cleared';
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        if (!registrations.length) return;
        return Promise.all(
          registrations.map(function (r) { return r.unregister(); })
        ).then(function () {
          return window.caches
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            : null;
        }).then(function () {
          // sessionStorage keeps this to a single reload per tab, so a
          // registration that reappears can never cause a reload loop.
          if (!sessionStorage.getItem(RELOAD_GUARD)) {
            sessionStorage.setItem(RELOAD_GUARD, '1');
            window.location.reload();
          }
        });
      }).catch(function (error) {
        console.warn('Service worker cleanup skipped:', error);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
